<!doctype html>
<!--
  tools/logo-social-page.html — the 1200×630 social card tools/export-logo.mjs
  screenshots into assets/logo/logo-social.png (issue #57). Real page, served
  over http by the tool, so /assets/logo/logo.svg resolves exactly like it does
  in the game. Not a game page: never captured, never deployed.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Look at Bobo — social card</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        background: radial-gradient(120% 130% at 22% 18%, #232a36 0%, #14181f 62%);
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 96px;
        font: 700 40px/1.35 ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
        color: #f7f4ee;
      }
      img {
        width: 280px;
        height: 280px;
        flex: none;
        filter: drop-shadow(0 18px 48px rgba(0, 0, 0, 0.55));
      }
      h1 {
        margin: 0;
        font-size: 92px;
        font-weight: 900;
        letter-spacing: 0.01em;
      }
      h1 em {
        font-style: normal;
        color: #e8b04a;
      }
      p {
        margin: 18px 0 0;
        font-size: 34px;
        font-weight: 700;
        color: rgba(247, 244, 238, 0.78);
      }
    </style>
  </head>
  <body>
    <img src="/assets/logo/logo.svg" alt="" />
    <div>
      <h1><em>look at</em> bobo</h1>
      <p>a first-person game about finding a cat doing cute things</p>
    </div>
  </body>
</html>
