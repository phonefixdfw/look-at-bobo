<!doctype html>
<!--
  tools/testscene.html — the Step 2 visual debugging target.

  A deliberately trivial placeholder scene (floor, box, leaning stick, a
  capsule standing in for Bobo, a clock hand) whose only job is to prove the
  capture tool works: every moment/time/view can be jumped to, captured and
  measured. Nothing here is art direction — Step 3 decides how the game looks.

  It implements the window.LC page contract (see docs/CAPTURE.md).

  Open it:      npm run serve  ->  http://127.0.0.1:8123/tools/testscene.html
  Capture it:   npm run capture
  Inject a fault: ?plant=lift | sink | jam | text   (selfTest must catch each one)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Look at Bobo — capture test scene</title>
    <!-- Inline placeholder icon: no extra request, so a 404 can never hide in a capture. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f3238'/%3E%3Ccircle cx='16' cy='17' r='7' fill='%23f4f6f8'/%3E%3C/svg%3E" />
    <script type="importmap">
      { "imports": { "three": "/vendor/three/three.module.js" } }
    </script>
    <style>
      /* Placeholder styling only: legible, neutral, not art direction. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9aa3ad;
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #moment-label {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 4px 8px;
        border-radius: 4px;
        background: rgba(16, 19, 23, 0.72);
        color: #f2f5f8;
        white-space: pre;
      }
      #ending {
        position: fixed;
        top: 42%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 44px;
        font-weight: 700;
        color: #ffffff;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
        display: none;
      }
      #ending.show {
        display: block;
      }
      #boot-error {
        position: fixed;
        inset: 8px;
        padding: 12px;
        background: #3a1512;
        color: #ffd9d4;
        font-family: ui-monospace, monospace;
        white-space: pre-wrap;
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="moment-label">starting…</div>
    <div id="ending">your did it! you wind</div>
    <div id="boot-error"></div>
    <script type="module" src="./testscene/testscene.js"></script>
  </body>
</html>
