<!doctype html>
<!--
  design/style-test.html — the Step 3 style test scene.

  The chosen look, proven in code: "Sunny Room, Soft Fur" — a believable,
  realistically lit modern apartment slice with a softly stylized, fur-shaded
  Bobo and the decoy cat built entirely from code (no downloads), plus the
  HUD vocabulary (score pill, the gentle X + "DAG!", the win celebration with
  the exact ending text `your did it! you wind`).

  This page is a *reference implementation* of docs/ART_STYLE.md: later code
  ports its material, marking and lighting functions instead of reinventing
  them. It implements the window.LC page contract (see docs/CAPTURE.md), so
  the Step 2 tool captures and gates it.

  Open it:     npm run serve  ->  http://127.0.0.1:8123/design/style-test.html
  Capture it:  npm run capture:style
  Prove the tell checks bite:  ?plant=dash  or  ?plant=size   (selfTest must FAIL)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Look at Bobo — style test (Sunny Room, Soft Fur)</title>
    <!-- Inline placeholder icon: no extra request, so a 404 can never hide in a capture. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1e26'/%3E%3Crect x='14' y='7' width='4' height='9' rx='2' fill='%23f1ece1'/%3E%3Ccircle cx='16' cy='21' r='6' fill='%23f1ece1'/%3E%3C/svg%3E" />
    <script type="importmap">
      { "imports": { "three": "/vendor/three/three.module.js" } }
    </script>
    <style>
      /* UI rules are part of the design system — see docs/ART_STYLE.md §8. */
      :root {
        --ui-ink: #10151c;
        --ui-paper: #f7f4ee;
        --ui-mustard: #e8b04a;
        --ui-coral: #ff8f7d;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14181f;
        font: 13px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #moment-label {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(16, 21, 28, 0.72);
        color: #f2f5f8;
        white-space: pre;
        z-index: 30;
      }

      /* ---------- HUD (design system §8): everything below the canvas ---------- */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      /* Score pill: warm off-white on near-black, the count-up is mustard. */
      #hud-score {
        position: fixed;
        top: 18px;
        right: 18px;
        display: none;
        align-items: center;
        gap: 10px;
        padding: 9px 18px;
        border-radius: 999px;
        background: rgba(16, 21, 28, 0.88);
        border: 1px solid rgba(247, 244, 238, 0.16);
        box-shadow: 0 6px 24px rgba(8, 10, 14, 0.35);
        color: var(--ui-paper);
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
      }
      #hud-score.show {
        display: flex;
      }
      #hud-score .num {
        color: var(--ui-mustard);
      }

      /* Soft aim dot: calm white; coral (never red) when the shout lands wrong. */
      #reticle {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border-radius: 50%;
        border: 2px solid rgba(247, 244, 238, 0.85);
        display: none;
      }
      #reticle.show {
        display: block;
      }
      #reticle::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: rgba(247, 244, 238, 0.9);
      }
      #reticle.soft {
        border-color: var(--ui-coral);
      }
      #reticle.soft::after {
        background: var(--ui-coral);
      }

      /* Wrong-cat: a soft round X in gentle coral + "DAG!" (exact, on purpose). */
      #dag-burst {
        position: fixed;
        left: 50%;
        top: 44%;
        transform: translate(-50%, -50%) scale(0);
        text-align: center;
        opacity: 0;
      }
      #dag-burst svg {
        display: block;
        margin: 0 auto;
        filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.35));
      }
      #dag-label {
        margin-top: 6px;
        font-size: 56px;
        font-weight: 900;
        letter-spacing: 0.04em;
        color: var(--ui-coral);
        text-shadow: 0 3px 0 rgba(16, 21, 28, 0.45), 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      /* Win: the exact ending text on a warm veil. Never "fixed". */
      #ending-veil {
        position: fixed;
        inset: 0;
        display: none;
        background: radial-gradient(120% 90% at 50% 40%, rgba(16, 21, 28, 0.06), rgba(16, 21, 28, 0.55));
      }
      #ending-veil.show {
        display: block;
      }
      #ending {
        position: fixed;
        top: 40%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 76px;
        font-weight: 900;
        letter-spacing: 0.015em;
        color: var(--ui-paper);
        text-shadow: 0 4px 0 rgba(16, 21, 28, 0.5), 0 18px 60px rgba(0, 0, 0, 0.55);
        display: none;
      }
      #ending.show {
        display: block;
      }

      #boot-error {
        position: fixed;
        inset: 8px;
        padding: 12px;
        background: #3a1512;
        color: #ffd9d4;
        font-family: ui-monospace, monospace;
        white-space: pre-wrap;
        display: none;
        z-index: 40;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="hud">
      <div id="hud-score"><span class="num">03</span><span> / 10</span></div>
      <div id="reticle"></div>
      <div id="dag-burst">
        <svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true">
          <g stroke="#ff8f7d" stroke-width="17" stroke-linecap="round" transform="rotate(-8 75 75)">
            <line x1="38" y1="38" x2="112" y2="112" />
            <line x1="112" y1="38" x2="38" y2="112" />
          </g>
        </svg>
        <div id="dag-label">DAG!</div>
      </div>
      <div id="ending-veil"></div>
      <div id="ending">your did it! you wind</div>
    </div>

    <div id="moment-label">starting…</div>
    <div id="boot-error"></div>
    <script type="module" src="./style-test/styletest.js"></script>
  </body>
</html>
